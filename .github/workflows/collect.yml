name: Collect LinkedIn followers

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/collect.yml'
      - 'collect_public.py'
      - 'test_collect_public.py'
      - 'index.html'
      - 'favicon.svg'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: follower-race-cloud
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate collector
        run: python3 -m unittest -v test_collect_public.py
      - name: Collect public company follower counts
        run: python3 collect_public.py --data data.json
      - name: Retain observation history and attempt status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update follower observations and collection status'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare dashboard
        run: |
          mkdir -p site
          cp index.html favicon.svg data.json site/
          touch site/.nojekyll
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
